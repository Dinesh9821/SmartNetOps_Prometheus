global:
  # Matches the exporter's own poll interval. Scraping faster gains nothing --
  # the exporter serves a cache that only refreshes every 60s.
  scrape_interval: 60s
  scrape_timeout: 30s
  evaluation_interval: 60s
  external_labels:
    environment: lab
    platform: wan-telemetry

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: meraki
    static_configs:
      - targets: ['meraki-exporter:9822']
        labels:
          source: meraki
          resolution_s: '60'

  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']

  - job_name: vmanage
    scrape_interval: 60s
    scrape_timeout: 30s
    static_configs:
      - targets: ['vmanage-exporter:9823']
        labels:
          source: vmanage
          resolution_s: '60'
